  <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
  <header>
    <h1>Counter</h1>
    <h2>DynoDigit</h2>

    <nav>
      <ul class="vnav">

      </ul>
    </nav>

  <main>
    <section id="counter">
      <h3>Counter</h3>
      <div id="cnum">0</div>
      <div class="flexra">
        <button class="cont" id="reducer" type="button" onclick="decrement()">-</button>
        <button class="cont" id="adder" type="button" onclick="increment()">+</button>
      </div>
      <div id="warning">Counter can't be negative!</div>
    </section>
  </main>
  <footer>

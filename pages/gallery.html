<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DynoDigit</title>
  <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
  <header>
    <h1>Counter</h1>
    <h2>DynoDigit</h2>
    <p>We provide different tools for your needs.</p>
    <nav>
      <ul class="vnav">
        <li><a class="btn" href="../index.html">Home</a></li>
        <li><a class="btn" href="./counter.html">Counter</a></li>
        <li><a class="btn" href="#gallery">Gallery</a></li>
        <li><a class="btn"href="./todo.html">To do list</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="gallery">
      <h3>Gallery</h3>
      <p>Gallery of Social media logos</p>
      <div>
        <figure>
          <img id="galbox" src="../assets/images/github.png" alt="Github logo">
          <figcaption>Github</figcaption>
        </figure>
      </div>
      <div class="flexra">
        <form onsubmit="showimg(); event.preventDefault()">
          <select id="choice">
            <option value="github">Github</option>
            <option value="google">Google</option>
            <option value="linkedin">LinkedIn</option>
            <option value="facebook">Facebook</option>
            <option value="youtube">YouTube</option>
          </select>
          <br>
          <button id="poster" type="submit">Show</button>
        </form>
      </div>
    </section>
  </main>
  <footer>
    
  </footer>
  <script src="../assets/js/gallery.js"></script>
</body>
</html>

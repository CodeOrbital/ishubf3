<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DynoDigit</title>
  <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
  <header>
    <div>
      <div class="brandn">DynoDigit</div>
      <p class="brandi">We provide different tools for your needs.</p>
    </div>
    <h1>To Do List</h1>
    <nav>
      <ul class="vnav">
        <li><a class="btn" href="../index.html">Home</a></li>
        <li><a class="btn" href="./counter.html">Counter</a></li>
        <li><a class="btn" href="./gallery.html">Gallery</a></li>
        <li><a class="btn"href="#todo">To do list</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="todo">
      <h2>To Do List</h2>
      <p>Manage your tasks with our to do list.</p>
      <div id="plusbox">
        <button type="button" id="plus" onclick="show()">
          +
        </button>
      </div>
      <div id="taskBox">
        <form onsubmit="addTask(); event.preventDefault()">
          <div id="taskIn">
            <input 
            id="taskdata" 
            type="text" 
            placeholder="Type your task" 
            required
            minlength="2"
            maxlength="25"
            >
            <button style="margin-top:20px;" type="submit">Add Task</button>
          </div>
          <div id="taskList">
            
          </div>
        </form>
      </div>
      
      <div id="placehold">
        There is no task that you added! <br>
        Press the plus button to start adding your tasks.
      </div>
    </section>
  </main>
  <footer>
    <div>
      2026 &copy;
    </div>
    <div>
      DynoDigit
    </div>
    <div>
      Amanuel
    </div>
  </footer>
  <script src="../assets/js/todo.js"></script>
</body>
</html>
